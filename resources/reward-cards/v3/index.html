<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>POING 카드 · 투명 배경</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#182239;color:#fff;font-family:system-ui}h1{font-size:24px}p{color:#c5d5e8}a{color:#a9deff}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}figure{margin:0}figure a{display:block;background:repeating-conic-gradient(#eee 0% 25%,#ccc 0% 50%) 0/16px 16px}img{display:block;width:100%;height:auto;image-rendering:pixelated}figcaption{padding:8px;text-align:center}</style>
<h1>POING 보상 카드 23종</h1><p>512×768 · 카드 외곽 480×720 · 동일한 투명 여백<br>체크무늬는 투명도 확인용이며 PNG에 포함되지 않습니다. <a href="prompts.txt">ImageGen 편집 프롬프트</a></p><div class="grid"></div>
<script>const cards={jump:'점프 강화',charge:'차지 가속',chargeCap:'점프 최대치',orbValue:'오브 가치',feather:'깃털',slowmo:'슬로우 모션',bigcloud:'큰 발판',coinBonus:'코인',magnet:'자석',doubleJump:'더블 점프',scoreMul:'점수 배율',scoreX2:'점수 2배',rocket:'로켓 부스트',shield:'보호막',trFrenzy:'광란',trGlass:'유리 대포',trGreed:'탐욕',trRush:'질주',legMagnet:'무한 자석',legHazard:'가시 파괴자',legShock:'파동 마스터',legRocket:'로켓 엔진',legFeather:'황금 깃털'};document.querySelector('.grid').innerHTML=Object.entries(cards).map(([id,name])=>`<figure><a href="${id}-card.png"><img src="${id}-card.png" alt="${name}"></a><figcaption>${name}</figcaption></figure>`).join('')</script></html>
